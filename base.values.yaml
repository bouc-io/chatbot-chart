# Base values for chatbot-chart (do not change across environments or over time)
replicaCount: 1
image:
  registry: ghcr.io/bouc-io
  repository: application/chatbot/chatbot-mirror-ui
  tag: "1.0.1942103836"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
pdb:
  create: true
  minAvailable: "0%"
  maxUnavailable: ""
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
environment:
  VITE_LOG_LEVEL: "warn"

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
